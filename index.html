<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Post Generator – Cart Full Theme</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      background: #f5f7fb;
      padding: 30px 20px;
      color: #1e293b;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #fff;
      border-radius: 16px;
      padding: 30px 40px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #0f172a;
    }
    .subtitle {
      color: #64748b;
      margin-bottom: 28px;
      font-size: 14px;
    }
    label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      margin: 18px 0 5px;
    }
    input, textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 14px;
      transition: border 0.2s;
      font-family: inherit;
    }
    input:focus, textarea:focus {
      border-color: #2563eb;
      outline: none;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
    }
    textarea {
      min-height: 120px;
      resize: vertical;
    }
    .flex-row {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }
    .flex-row > * { flex: 1 1 200px; }
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 12px 0 6px;
    }
    .checkbox-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #2563eb;
      cursor: pointer;
    }
    .btn {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 20px;
      width: 100%;
    }
    .btn:hover { background: #1d4ed8; }
    .btn:active { transform: scale(0.97); }
    .btn-secondary {
      background: #e2e8f0;
      color: #0f172a;
      width: auto;
      padding: 8px 18px;
      font-size: 13px;
      margin-top: 10px;
    }
    .btn-secondary:hover { background: #cbd5e1; }
    #output {
      margin-top: 30px;
      border-top: 2px solid #e2e8f0;
      padding-top: 20px;
    }
    #output h2 {
      font-size: 18px;
      margin-bottom: 10px;
    }
    #generatedCode {
      background: #f1f5f9;
      padding: 16px 20px;
      border-radius: 8px;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 13px;
      font-family: 'Courier New', monospace;
      max-height: 500px;
      overflow: auto;
      border: 1px solid #e2e8f0;
    }
    #preview {
      background: #f8fafc;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      margin-top: 15px;
    }
    #preview img { max-width: 100%; height: auto; border-radius: 6px; }
    .copy-section {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .toast {
      background: #0f172a;
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }
    @media (max-width: 480px) {
      .container { padding: 20px; }
      .flex-row { flex-direction: column; gap: 0; }
    }
  </style>
</head>
<body>
<div class="container">
  <h1>📦 Product Post Generator</h1>
  <p class="subtitle">For the <strong>Cart Full</strong> Blogger theme – fill in the fields and copy the generated HTML.</p>

  <form id="postForm" onsubmit="return false;">
    <div class="flex-row">
      <div>
        <label for="title">Product Title *</label>
        <input type="text" id="title" placeholder="e.g. iPhone 15 Pro Max" required>
      </div>
      <div>
        <label for="price">Price (numbers only) *</label>
        <input type="number" id="price" placeholder="e.g. 4500000" required>
      </div>
    </div>

    <label for="description">Description (HTML supported)</label>
    <textarea id="description" placeholder="Write your product description here. You can use &lt;b&gt;, &lt;i&gt;, &lt;ul&gt;, etc."></textarea>

    <div class="flex-row">
      <div>
        <label for="imageUrl">Image URL (optional inline image)</label>
        <input type="url" id="imageUrl" placeholder="https://example.com/product.jpg">
      </div>
      <div>
        <label for="labels">Categories / Labels</label>
        <input type="text" id="labels" placeholder="e.g. Smartphones, Deals, New">
      </div>
    </div>

    <div class="checkbox-group">
      <input type="checkbox" id="sale">
      <label for="sale" style="margin:0; font-weight:400;">Add <strong>SALE</strong> badge? (Adds <code>product_off show</code> class – works if theme supports it)</label>
    </div>

    <button type="button" class="btn" onclick="generatePost()">⚡ Generate Post HTML</button>
  </form>

  <div id="output" style="display:none;">
    <h2>📄 Generated HTML</h2>
    <div class="copy-section">
      <button class="btn btn-secondary" onclick="copyCode()">📋 Copy to Clipboard</button>
      <span id="toastMsg" class="toast">Copied!</span>
    </div>
    <pre id="generatedCode"></pre>

    <h3 style="margin-top:20px;">👁️ Preview</h3>
    <div id="preview"></div>
  </div>
</div>

<script>
  function generatePost() {
    const title = document.getElementById('title').value.trim();
    const price = document.getElementById('price').value.trim();
    const description = document.getElementById('description').value.trim();
    const imageUrl = document.getElementById('imageUrl').value.trim();
    const labels = document.getElementById('labels').value.trim();
    const sale = document.getElementById('sale').checked;

    if (!title || !price) {
      alert('Please fill in Title and Price.');
      return;
    }

    // Build post body HTML
    let body = '';

    // Optional inline image
    if (imageUrl) {
      body += `<img src="${imageUrl}" alt="${title}" style="max-width:100%; border-radius:8px; margin:0 0 16px;"/>\n`;
    }

    // Description (if any)
    if (description) {
      body += `${description}\n`;
    }

    // Price shortcode – this is what the theme uses to display the price in meta-price spans
    body += `price/${price}\n`;

    // Optional sale badge (the theme may look for a label or class, but we add a note)
    if (sale) {
      body += `\n<!-- Add "SALE" label in Blogger post settings to show sale badge -->\n`;
    }

    // Labels hint
    if (labels) {
      body += `\n<!-- Labels/Categories: ${labels} -->\n`;
    }

    // Full post content to copy
    const fullContent = body.trim();

    // Display generated code
    document.getElementById('generatedCode').textContent = fullContent;
    document.getElementById('output').style.display = 'block';

    // Preview (render HTML safely)
    const previewDiv = document.getElementById('preview');
    previewDiv.innerHTML = fullContent;

    // Also show a note about the featured image
    const note = document.createElement('p');
    note.style.marginTop = '12px';
    note.style.fontSize = '13px';
    note.style.color = '#64748b';
    note.innerHTML = '💡 <strong>Tip:</strong> Upload a <strong>featured image</strong> separately in the Blogger post editor. The image above is for inline use only.';
    previewDiv.appendChild(note);

    // Scroll to output
    document.getElementById('output').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function copyCode() {
    const code = document.getElementById('generatedCode').textContent;
    navigator.clipboard.writeText(code).then(() => {
      const toast = document.getElementById('toastMsg');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }).catch(() => {
      alert('Could not copy. Please select and copy manually.');
    });
  }

  // Allow Ctrl+Enter to generate
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      generatePost();
    }
  });
</script>
</body>
</html>
